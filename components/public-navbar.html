<style>
  /* ── Navbar Base ────────────────────────────────────────────── */
  #public-navbar {
    font-family: var(--font-family);
    height: var(--navbar-height);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1030;
    transition:
      background var(--transition-base),
      box-shadow var(--transition-base);
  }

  #public-navbar.nav-transparent {
    background: transparent !important;
  }

  #public-navbar.nav-scrolled {
    background: var(--navbar-bg) !important;
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
  }

  /* ── Logo ───────────────────────────────────────────────────── */
  .nav-logo-text {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--primary);
    text-decoration: none;
    letter-spacing: -0.3px;
  }
  .nav-logo-text:hover {
    color: var(--primary-dark);
  }

  /* ── Nav Links (desktop) ────────────────────────────────────── */
  .nav-center-links .nav-link {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-primary);
    padding: 0.4rem 0.9rem;
    position: relative;
    transition: color var(--transition-base);
  }

  .nav-center-links .nav-link::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: 0.9rem;
    right: 0.9rem;
    height: 2px;
    background: var(--primary);
    transform: scaleX(0);
    transition: transform var(--transition-base);
    border-radius: 2px;
  }

  .nav-center-links .nav-link:hover,
  .nav-center-links .nav-link.active {
    color: var(--primary);
  }

  .nav-center-links .nav-link:hover::after,
  .nav-center-links .nav-link.active::after {
    transform: scaleX(1);
  }

  /* Transparent mode: links white */
  #public-navbar.nav-transparent .nav-center-links .nav-link {
    color: rgba(255, 255, 255, 0.9);
  }
  #public-navbar.nav-transparent .nav-center-links .nav-link:hover,
  #public-navbar.nav-transparent .nav-center-links .nav-link.active {
    color: #fff;
  }
  #public-navbar.nav-transparent .nav-logo-text {
    color: #fff;
  }
  #public-navbar.nav-transparent .btn-nav-login {
    color: #fff;
    border-color: #fff;
  }
  #public-navbar.nav-transparent .btn-nav-toggle {
    color: #fff;
  }
  #public-navbar.nav-transparent .nav-hamburger {
    color: #fff;
  }

  /* ── Right-side Buttons ─────────────────────────────────────── */
  .btn-nav-toggle {
    background: none;
    border: none;
    font-size: 1.1rem;
    color: var(--text-primary);
    padding: 6px 10px;
    border-radius: var(--border-radius);
    transition:
      background var(--transition-base),
      color var(--transition-base);
    cursor: pointer;
  }
  .btn-nav-toggle:hover {
    background: var(--surface-alt);
  }

  .btn-nav-login {
    font-size: 0.82rem;
    font-weight: 600;
    padding: 6px 16px;
    color: var(--primary);
    border: 1.5px solid var(--primary);
    border-radius: var(--border-radius);
    background: transparent;
    transition:
      background var(--transition-base),
      color var(--transition-base);
    text-decoration: none;
  }
  .btn-nav-login:hover {
    background: var(--primary);
    color: #fff;
  }

  .btn-nav-cta {
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 18px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--border-radius);
    text-decoration: none;
    transition:
      background var(--transition-base),
      transform var(--transition-base);
  }
  .btn-nav-cta:hover {
    background: var(--primary-dark);
    color: #fff;
    transform: translateY(-1px);
  }

  /* ── Language Dropdown ──────────────────────────────────────── */
  .lang-dropdown .dropdown-toggle {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-primary);
    background: none;
    border: 1.5px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: 5px 10px;
    transition: border-color var(--transition-base);
  }
  .lang-dropdown .dropdown-toggle:hover {
    border-color: var(--primary);
  }
  .lang-dropdown .dropdown-toggle::after {
    margin-left: 4px;
  }
  .lang-dropdown .dropdown-menu {
    min-width: 90px;
    font-size: 0.82rem;
    border: 1px solid var(--border-color);
    box-shadow: var(--card-shadow);
    border-radius: var(--border-radius);
  }
  .lang-dropdown .dropdown-item:hover {
    background: var(--primary-light);
    color: var(--primary);
  }

  /* Transparent mode: language button */
  #public-navbar.nav-transparent .lang-dropdown .dropdown-toggle {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.5);
  }

  /* ── Mobile Hamburger ───────────────────────────────────────── */
  .nav-hamburger {
    background: none;
    border: none;
    font-size: 1.5rem;
    color: var(--text-primary);
    padding: 4px 8px;
    cursor: pointer;
  }

  /* ── Off-canvas Mobile Menu ─────────────────────────────────── */
  #mobileNavOffcanvas .offcanvas-header {
    border-bottom: 1px solid var(--border-color);
    padding: 1rem 1.25rem;
  }
  #mobileNavOffcanvas .offcanvas-body {
    padding: 1.25rem;
  }

  .mobile-nav-link {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-primary);
    padding: 0.65rem 0.75rem;
    border-radius: var(--border-radius);
    text-decoration: none;
    transition:
      background var(--transition-base),
      color var(--transition-base);
  }
  .mobile-nav-link:hover,
  .mobile-nav-link.active {
    background: var(--primary-light);
    color: var(--primary);
  }
  .mobile-nav-link i {
    font-size: 1rem;
  }

  .mobile-nav-divider {
    border-top: 1px solid var(--border-color);
    margin: 0.75rem 0;
  }
</style>

<!-- ── NAVBAR ─────────────────────────────────────────────────── -->
<nav
  id="public-navbar"
  x-data="{
    scrolled: false,
    dark: false,
    toggle() {
      this.dark = !this.dark;
      document.documentElement.setAttribute('data-theme', this.dark ? 'dark' : 'light');
      localStorage.setItem('lms-theme', this.dark ? 'dark' : 'light');
    },
    init() {
      const saved = localStorage.getItem('lms-theme');
      this.dark = saved === 'dark' ? true : saved === 'light' ? false : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', this.dark ? 'dark' : 'light');
      this.scrolled = window.scrollY > 50;
      window.addEventListener('scroll', () => { this.scrolled = window.scrollY > 50; });
    }
  }"
  :class="scrolled ? 'nav-scrolled' : 'nav-transparent'"
  class="d-flex align-items-center px-3 px-lg-5"
>
  <div class="container-fluid px-0 d-flex align-items-center">
    <!-- ── Logo ───────────────────────────────────────────────── -->
    <a
      href="index.html"
      class="nav-logo-text d-flex align-items-center gap-2 me-4"
    >
      <i
        class="bi bi-mortarboard-fill"
        style="font-size: 1.5rem; color: var(--primary)"
      ></i>
      EduLearn
    </a>

    <!-- ── Center Nav Links (desktop) ────────────────────────── -->
    <ul class="nav nav-center-links d-none d-lg-flex mb-0 me-auto">
      <li class="nav-item">
        <a class="nav-link active" href="index.html">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="courses.html">Courses</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="about.html">About</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="blog.html">Blog</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="pricing.html">Pricing</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="contact.html">Contact</a>
      </li>
    </ul>

    <!-- ── Right Side Controls ───────────────────────────────── -->
    <div class="d-flex align-items-center gap-2 ms-auto">
      <!-- Dark / Light Toggle -->
      <button
        class="btn-nav-toggle d-none d-md-inline-flex align-items-center"
        @click="toggle()"
        :title="dark ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        aria-label="Toggle dark mode"
      >
        <i :class="dark ? 'bi bi-sun-fill' : 'bi bi-moon-fill'"></i>
      </button>

      <!-- Language Dropdown -->
      <div class="lang-dropdown dropdown d-none d-md-block">
        <button
          class="dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <i class="bi bi-globe me-1"></i> EN
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#">🇺🇸 EN</a></li>
          <li><a class="dropdown-item" href="#">🇸🇦 AR</a></li>
          <li><a class="dropdown-item" href="#">🇫🇷 FR</a></li>
        </ul>
      </div>

      <!-- Log In Button -->
      <a href="login.html" class="btn-nav-login d-none d-md-inline-block"
        >Log In</a
      >

      <!-- Get Started CTA -->
      <a href="register.html" class="btn-nav-cta d-none d-md-inline-block">
        Get Started Free
      </a>

      <!-- Mobile Hamburger -->
      <button
        class="nav-hamburger d-lg-none"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#mobileNavOffcanvas"
        aria-controls="mobileNavOffcanvas"
        aria-label="Open navigation menu"
      >
        <i class="bi bi-list"></i>
      </button>
    </div>
    <!-- /Right Side Controls -->
  </div>
</nav>
<!-- /NAVBAR -->

<!-- ── MOBILE OFF-CANVAS DRAWER ──────────────────────────────── -->
<div
  class="offcanvas offcanvas-end"
  tabindex="-1"
  id="mobileNavOffcanvas"
  aria-labelledby="mobileNavOffcanvasLabel"
  style="width: 300px; background: var(--surface); color: var(--text-primary)"
>
  <div class="offcanvas-header">
    <a href="index.html" class="nav-logo-text d-flex align-items-center gap-2">
      <i
        class="bi bi-mortarboard-fill"
        style="font-size: 1.4rem; color: var(--primary)"
      ></i>
      EduLearn
    </a>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
      aria-label="Close"
    ></button>
  </div>

  <div class="offcanvas-body">
    <!-- Nav Links -->
    <nav class="d-flex flex-column gap-1">
      <a href="index.html" class="mobile-nav-link active">
        <i class="bi bi-house"></i> Home
      </a>
      <a href="courses.html" class="mobile-nav-link">
        <i class="bi bi-grid"></i> Courses
      </a>
      <a href="about.html" class="mobile-nav-link">
        <i class="bi bi-info-circle"></i> About
      </a>
      <a href="blog.html" class="mobile-nav-link">
        <i class="bi bi-newspaper"></i> Blog
      </a>
      <a href="pricing.html" class="mobile-nav-link">
        <i class="bi bi-tag"></i> Pricing
      </a>
      <a href="contact.html" class="mobile-nav-link">
        <i class="bi bi-envelope"></i> Contact
      </a>
    </nav>

    <div class="mobile-nav-divider"></div>

    <!-- Auth Buttons -->
    <div class="d-flex flex-column gap-2">
      <a href="login.html" class="btn btn-outline-primary w-100">Log In</a>
      <a href="register.html" class="btn btn-primary w-100">Get Started Free</a>
    </div>

    <div class="mobile-nav-divider"></div>

    <!-- Theme + Language -->
    <div class="d-flex align-items-center justify-content-between px-1">
      <!-- Dark/Light toggle -->
      <div
        x-data="{
        get dark() { return document.documentElement.getAttribute('data-theme') === 'dark'; },
        toggle() {
          const isDark = !this.dark;
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          localStorage.setItem('lms-theme', isDark ? 'dark' : 'light');
        }
      }"
        class="d-flex align-items-center gap-2"
      >
        <span style="font-size: 0.82rem; color: var(--text-muted)">Theme</span>
        <button class="btn-nav-toggle" @click="toggle()">
          <i :class="dark ? 'bi bi-sun-fill' : 'bi bi-moon-fill'"></i>
          <span
            x-text="dark ? 'Light' : 'Dark'"
            style="font-size: 0.82rem; margin-left: 4px"
          ></span>
        </button>
      </div>

      <!-- Language Dropdown -->
      <div class="lang-dropdown dropdown">
        <button
          class="dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          style="font-size: 0.82rem"
        >
          <i class="bi bi-globe me-1"></i> EN
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">🇺🇸 EN</a></li>
          <li><a class="dropdown-item" href="#">🇸🇦 AR</a></li>
          <li><a class="dropdown-item" href="#">🇫🇷 FR</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>
<!-- /MOBILE OFF-CANVAS DRAWER -->
