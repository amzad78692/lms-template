<!-- ============================================================
     EduLearn LMS — Student Panel Top Navbar Component
     File: components/student-navbar.html
     Dependencies:
       - Bootstrap 5.3 (CSS + Bundle JS)
       - Bootstrap Icons 1.11
       - Alpine.js 3.x (defer)
       - Notyf 3.x  (CSS + JS)  → window.lmsNotify
       - NProgress 0.2.x (CSS + JS)  → page load bar
       - app.js (sidebarState, themeToggle, globalSearch)
     Usage:
       Place inside the page shell, after the sidebar.
       The parent element must have x-data="sidebarState()"
       for the hamburger (toggleMobile) to work.
     ============================================================ -->

<style>
  /* ── Navbar Shell ───────────────────────────────────────────── */
  #student-navbar {
    position: fixed;
    top: 0;
    right: 0;
    height: var(--navbar-height);
    background: var(--navbar-bg);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    z-index: 1010;
    transition:
      left var(--transition-base),
      background var(--transition-base);
    box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
    font-family: var(--font-family);
  }
  /* Shift right to clear sidebar on desktop */
  @media (min-width: 992px) {
    #student-navbar {
      left: var(--sidebar-width);
    }
    #student-navbar.sidebar-collapsed-offset {
      left: var(--sidebar-collapsed);
    }
  }
  @media (max-width: 991.98px) {
    #student-navbar {
      left: 0;
    }
  }

  /* ── Left Zone ──────────────────────────────────────────────── */
  .navbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
  }
  .navbar-hamburger {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--text-primary);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background var(--transition-base);
    flex-shrink: 0;
  }
  .navbar-hamburger:hover {
    background: var(--surface-alt);
  }
  .navbar-hamburger i {
    font-size: 1.35rem;
  }

  .navbar-page-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .navbar-breadcrumb {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .navbar-breadcrumb a {
    color: var(--text-muted);
    text-decoration: none;
  }
  .navbar-breadcrumb a:hover {
    color: var(--primary);
  }
  .navbar-breadcrumb .sep {
    margin: 0 2px;
  }

  /* ── Search Bar (desktop) ───────────────────────────────────── */
  .navbar-search-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    background: var(--surface-alt);
    color: var(--text-muted);
    font-size: 0.8rem;
    font-family: var(--font-family);
    cursor: pointer;
    transition:
      border-color var(--transition-base),
      background var(--transition-base);
    white-space: nowrap;
  }
  .navbar-search-btn:hover {
    border-color: var(--primary);
    background: var(--surface);
    color: var(--text-primary);
  }
  .navbar-search-btn .kbd-hint {
    font-size: 0.7rem;
    background: var(--border-color);
    color: var(--text-muted);
    padding: 1px 5px;
    border-radius: 4px;
    line-height: 1.5;
  }

  /* ── Right Zone ─────────────────────────────────────────────── */
  .navbar-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ── Icon Buttons ───────────────────────────────────────────── */
  .navbar-icon-btn {
    position: relative;
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition:
      background var(--transition-base),
      color var(--transition-base);
  }
  .navbar-icon-btn:hover {
    background: var(--surface-alt);
    color: var(--text-primary);
  }
  .navbar-icon-btn i {
    font-size: 1.15rem;
  }

  /* Badge on bell */
  .navbar-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-size: 0.6rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--navbar-bg);
    line-height: 1;
  }

  /* ── Notification Dropdown ──────────────────────────────────── */
  .notif-dropdown {
    width: 340px;
    max-height: 440px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-lg);
    background: var(--surface);
    box-shadow: var(--card-shadow-hover);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font-family);
  }
  .notif-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border-color);
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--text-primary);
    flex-shrink: 0;
  }
  .notif-mark-all {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--primary);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .notif-mark-all:hover {
    text-decoration: underline;
  }
  .notif-list {
    overflow-y: auto;
    flex: 1;
    max-height: 320px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-color) transparent;
  }
  .notif-item {
    display: flex;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
    transition: background var(--transition-base);
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }
  .notif-item:last-child {
    border-bottom: none;
  }
  .notif-item:hover {
    background: var(--surface-alt);
  }
  .notif-item.unread {
    background: rgba(13, 110, 253, 0.04);
  }
  .notif-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .notif-content {
    flex: 1;
    min-width: 0;
  }
  .notif-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .notif-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .notif-time {
    font-size: 0.7rem;
    color: var(--text-muted);
    white-space: nowrap;
    margin-top: 3px;
  }
  .notif-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--primary);
    flex-shrink: 0;
    margin-top: 5px;
  }
  .notif-footer {
    padding: 10px 16px;
    text-align: center;
    border-top: 1px solid var(--border-color);
    flex-shrink: 0;
  }
  .notif-footer a {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--primary);
    text-decoration: none;
  }
  .notif-footer a:hover {
    text-decoration: underline;
  }

  /* ── Avatar / User Dropdown ─────────────────────────────────── */
  .navbar-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--primary);
    cursor: pointer;
    transition: opacity var(--transition-base);
  }
  .navbar-avatar:hover {
    opacity: 0.85;
  }

  .user-dropdown {
    width: 220px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-lg);
    background: var(--surface);
    box-shadow: var(--card-shadow-hover);
    overflow: hidden;
    font-family: var(--font-family);
  }
  .user-dropdown-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border-color);
  }
  .user-dropdown-name {
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.3;
  }
  .user-dropdown-role {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 1px;
  }
  .user-dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    font-size: 0.82rem;
    color: var(--text-secondary);
    text-decoration: none;
    transition:
      background var(--transition-base),
      color var(--transition-base);
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    font-family: var(--font-family);
  }
  .user-dropdown-item:hover {
    background: var(--surface-alt);
    color: var(--text-primary);
  }
  .user-dropdown-item.danger {
    color: var(--danger);
  }
  .user-dropdown-item.danger:hover {
    background: rgba(220, 53, 69, 0.08);
    color: var(--danger);
  }
  .user-dropdown-item i {
    font-size: 1rem;
    width: 18px;
    text-align: center;
  }

  .user-dropdown-divider {
    border-top: 1px solid var(--border-color);
    margin: 4px 0;
  }

  /* ── Global Search Overlay ──────────────────────────────────── */
  .search-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 2000;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 80px;
    backdrop-filter: blur(3px);
  }
  .search-modal {
    width: 560px;
    max-width: 92vw;
    background: var(--surface);
    border-radius: var(--border-radius-lg);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    font-family: var(--font-family);
  }
  .search-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-color);
  }
  .search-input-row i {
    font-size: 1.1rem;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .search-input-row input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 1rem;
    font-family: var(--font-family);
    color: var(--text-primary);
  }
  .search-input-row input::placeholder {
    color: var(--text-muted);
  }
  .search-kbd {
    font-size: 0.7rem;
    background: var(--border-color);
    color: var(--text-muted);
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .search-results {
    max-height: 320px;
    overflow-y: auto;
    padding: 6px 0;
  }
  .search-result-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    text-decoration: none;
    color: var(--text-primary);
    transition: background var(--transition-base);
  }
  .search-result-item:hover {
    background: var(--surface-alt);
  }
  .search-result-item i {
    font-size: 1rem;
    color: var(--primary);
    width: 20px;
    text-align: center;
  }
  .search-result-item span {
    font-size: 0.875rem;
  }
  .search-empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-muted);
    font-size: 0.875rem;
  }
  .search-hint {
    padding: 10px 16px;
    font-size: 0.72rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 16px;
  }
  .search-hint kbd {
    font-size: 0.7rem;
    background: var(--border-color);
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* ── NProgress custom color ─────────────────────────────────── */
  #nprogress .bar {
    background: var(--primary) !important;
  }
  #nprogress .peg {
    box-shadow:
      0 0 10px var(--primary),
      0 0 5px var(--primary) !important;
  }
  #nprogress .spinner-icon {
    border-top-color: var(--primary) !important;
    border-left-color: var(--primary) !important;
  }
</style>

<!-- ════════════════════════════════════════════════════════════
     TOP NAVBAR
     x-data connects to parent sidebarState() scope
     ════════════════════════════════════════════════════════════ -->
<nav
  id="student-navbar"
  :class="{ 'sidebar-collapsed-offset': collapsed }"
  x-data
>
  <!-- ── LEFT: Hamburger + Page Title + Breadcrumb ────────────── -->
  <div class="navbar-left">
    <!-- Hamburger: on mobile opens off-canvas; on desktop toggles collapse -->
    <button
      class="navbar-hamburger d-lg-none"
      @click="toggleMobile()"
      aria-label="Toggle sidebar"
      data-bs-toggle="offcanvas"
      data-bs-target="#mobileSidebarOffcanvas"
    >
      <i class="bi bi-list"></i>
    </button>

    <!-- Desktop collapse toggle (hidden on mobile) -->
    <button
      class="navbar-hamburger d-none d-lg-flex"
      @click="toggle()"
      :aria-label="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <i class="bi bi-list"></i>
    </button>

    <!-- Page title + breadcrumb -->
    <div>
      <div class="navbar-page-title" id="navbarPageTitle">Dashboard</div>
      <div class="navbar-breadcrumb d-none d-sm-flex" id="navbarBreadcrumb">
        <a href="../student/dashboard.html"><i class="bi bi-house"></i></a>
        <span class="sep"
          ><i class="bi bi-chevron-right" style="font-size: 0.6rem"></i
        ></span>
        <span id="navbarBreadcrumbCurrent">Dashboard</span>
      </div>
    </div>
  </div>
  <!-- /LEFT -->

  <!-- ── CENTER: Search Bar (desktop only) ────────────────────── -->
  <div class="d-none d-md-block" x-data="globalSearch()">
    <!-- Search Trigger Button -->
    <button
      class="navbar-search-btn"
      @click="openOverlay()"
      aria-label="Open search (Ctrl+K)"
    >
      <i class="bi bi-search" style="font-size: 0.85rem"></i>
      <span>Search pages…</span>
      <span class="kbd-hint">⌘K</span>
    </button>

    <!-- Search Overlay -->
    <div
      class="search-overlay"
      x-show="open"
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-100"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      @click.self="closeOverlay()"
      style="display: none"
    >
      <div class="search-modal" @keydown.escape.window="closeOverlay()">
        <!-- Input Row -->
        <div class="search-input-row">
          <i class="bi bi-search"></i>
          <input
            id="global-search-input"
            type="text"
            placeholder="Search pages, courses, settings…"
            x-model="query"
            @input="search()"
            autocomplete="off"
            spellcheck="false"
          />
          <span class="search-kbd">ESC</span>
        </div>

        <!-- Results -->
        <div class="search-results">
          <!-- No query yet -->
          <div class="search-empty" x-show="query.length === 0">
            <i
              class="bi bi-search d-block mb-2"
              style="font-size: 1.5rem; opacity: 0.3"
            ></i>
            Start typing to search pages…
          </div>
          <!-- No matches -->
          <div
            class="search-empty"
            x-show="query.length > 0 && results.length === 0"
          >
            <i
              class="bi bi-inbox d-block mb-2"
              style="font-size: 1.5rem; opacity: 0.3"
            ></i>
            No results for "<span x-text="query"></span>"
          </div>
          <!-- Matches -->
          <template x-for="item in results" :key="item.url">
            <a
              :href="'../' + item.url"
              class="search-result-item"
              @click="closeOverlay()"
            >
              <i :class="'bi ' + item.icon"></i>
              <span x-text="item.title"></span>
            </a>
          </template>
        </div>

        <!-- Keyboard hints -->
        <div class="search-hint">
          <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
          <span><kbd>↵</kbd> Open</span>
          <span><kbd>ESC</kbd> Close</span>
        </div>
      </div>
    </div>
    <!-- /Search Overlay -->
  </div>
  <!-- /CENTER -->

  <!-- ── RIGHT: Bell + Theme Toggle + Avatar ──────────────────── -->
  <div class="navbar-right" x-data="notificationPanel()">
    <!-- ── Notification Bell ────────────────────────────────── -->
    <div class="dropdown">
      <button
        class="navbar-icon-btn"
        id="notifDropdownBtn"
        data-bs-toggle="dropdown"
        data-bs-auto-close="outside"
        aria-expanded="false"
        aria-label="Notifications"
      >
        <i class="bi bi-bell-fill"></i>
        <!-- Unread count badge -->
        <span
          class="navbar-badge"
          x-show="unreadCount > 0"
          x-text="unreadCount > 9 ? '9+' : unreadCount"
        ></span>
      </button>

      <div
        class="dropdown-menu dropdown-menu-end p-0 border-0 notif-dropdown"
        aria-labelledby="notifDropdownBtn"
      >
        <!-- Header -->
        <div class="notif-header">
          <span
            >Notifications
            <span
              class="badge bg-primary ms-1"
              style="font-size: 0.65rem"
              x-text="unreadCount"
              x-show="unreadCount > 0"
            ></span
          ></span>
          <button
            class="notif-mark-all"
            @click="markAllRead()"
            x-show="unreadCount > 0"
          >
            Mark all read
          </button>
        </div>

        <!-- Notification list -->
        <div class="notif-list">
          <template x-for="notif in notifications" :key="notif.id">
            <a
              href="#"
              class="notif-item"
              :class="{ 'unread': !notif.read }"
              @click.prevent="readNotif(notif.id)"
            >
              <div
                class="notif-icon"
                :style="'background:' + notif.iconBg + ';color:' + notif.iconColor"
              >
                <i :class="'bi ' + notif.icon"></i>
              </div>
              <div class="notif-content">
                <div class="notif-title" x-text="notif.title"></div>
                <div class="notif-text" x-text="notif.text"></div>
                <div class="notif-time" x-text="notif.time"></div>
              </div>
              <div class="notif-dot" x-show="!notif.read"></div>
            </a>
          </template>
        </div>

        <!-- Footer -->
        <div class="notif-footer">
          <a href="../student/announcements.html"
            >View all notifications <i class="bi bi-arrow-right"></i
          ></a>
        </div>
      </div>
    </div>
    <!-- /Bell -->

    <!-- ── Mobile Search Icon ───────────────────────────────── -->
    <div class="d-md-none" x-data="globalSearch()">
      <button
        class="navbar-icon-btn"
        @click="openOverlay()"
        aria-label="Search"
      >
        <i class="bi bi-search"></i>
      </button>
      <!-- Reuse same overlay markup -->
      <div
        class="search-overlay"
        x-show="open"
        x-transition.opacity
        @click.self="closeOverlay()"
        style="display: none"
      >
        <div class="search-modal" @keydown.escape.window="closeOverlay()">
          <div class="search-input-row">
            <i class="bi bi-search"></i>
            <input
              type="text"
              placeholder="Search…"
              x-model="query"
              @input="search()"
              @focus="$el.select()"
              autocomplete="off"
            />
            <span class="search-kbd">ESC</span>
          </div>
          <div class="search-results">
            <div class="search-empty" x-show="query.length === 0">
              Start typing…
            </div>
            <div
              class="search-empty"
              x-show="query.length > 0 && results.length === 0"
            >
              No results for "<span x-text="query"></span>"
            </div>
            <template x-for="item in results" :key="item.url">
              <a
                :href="'../' + item.url"
                class="search-result-item"
                @click="closeOverlay()"
              >
                <i :class="'bi ' + item.icon"></i>
                <span x-text="item.title"></span>
              </a>
            </template>
          </div>
          <div class="search-hint">
            <span><kbd>ESC</kbd> Close</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Dark / Light Toggle ──────────────────────────────── -->
    <div x-data="themeToggle()">
      <button
        class="navbar-icon-btn"
        @click="toggle()"
        :aria-label="dark ? 'Switch to light mode' : 'Switch to dark mode'"
        :title="dark ? 'Light mode' : 'Dark mode'"
        data-bs-toggle="tooltip"
        data-bs-placement="bottom"
      >
        <i :class="dark ? 'bi bi-sun-fill' : 'bi bi-moon-fill'"></i>
      </button>
    </div>

    <!-- ── Avatar / User Dropdown ───────────────────────────── -->
    <div class="dropdown">
      <img
        src="https://placehold.co/34x34/0d6efd/ffffff?text=AJ"
        alt="Alex Johnson"
        class="navbar-avatar"
        id="userDropdownBtn"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        role="button"
        tabindex="0"
      />

      <div
        class="dropdown-menu dropdown-menu-end p-0 border-0 user-dropdown"
        aria-labelledby="userDropdownBtn"
      >
        <!-- User info header -->
        <div class="user-dropdown-header">
          <div class="user-dropdown-name">Alex Johnson</div>
          <div class="user-dropdown-role">Student · Free Plan</div>
        </div>

        <!-- Links -->
        <a href="../student/profile.html" class="user-dropdown-item">
          <i class="bi bi-person-circle"></i> View Profile
        </a>
        <a href="../student/settings.html" class="user-dropdown-item">
          <i class="bi bi-gear"></i> Settings
        </a>
        <a href="../student/certificates.html" class="user-dropdown-item">
          <i class="bi bi-award"></i> My Certificates
        </a>

        <div class="user-dropdown-divider"></div>

        <a href="../student/help.html" class="user-dropdown-item">
          <i class="bi bi-question-circle"></i> Help & Support
