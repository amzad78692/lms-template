<!-- ============================================================
     EduLearn LMS — Popular Courses Section
     File: sections/popular-courses.html
     Libraries used: AOS 2.3.x
     Alpine.js handles tab filtering
     ============================================================ -->

<style>
  /* ── Section Wrapper ────────────────────────────────────────── */
  .courses-section {
    padding: 100px 0;
    background: var(--surface-alt);
    font-family: var(--font-family);
  }

  /* ── Section Header ─────────────────────────────────────────── */
  .courses-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  [data-theme="dark"] .courses-eyebrow {
    background: rgba(13, 110, 253, 0.18);
    color: #93c5fd;
  }
  .courses-title {
    font-size: clamp(1.9rem, 3.5vw, 2.6rem);
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.2;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
  }
  .courses-title .accent {
    color: var(--primary);
  }
  .courses-subtitle {
    font-size: 1rem;
    color: var(--text-muted);
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* ── Filter Tabs ────────────────────────────────────────────── */
  .courses-filter-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 48px;
  }
  .filter-tab {
    padding: 8px 20px;
    border-radius: 50px;
    border: 1.5px solid var(--border-color);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: var(--font-family);
    user-select: none;
  }
  .filter-tab:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }
  .filter-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 4px 14px rgba(13, 110, 253, 0.35);
  }
  [data-theme="dark"] .filter-tab:hover,
  [data-theme="dark"] .filter-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  [data-theme="dark"] .filter-tab:not(.active):hover {
    background: rgba(13, 110, 253, 0.15);
    color: #93c5fd;
    border-color: #93c5fd;
  }

  /* ── Course Card ────────────────────────────────────────────── */
  .course-card {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-lg);
    overflow: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
    transition:
      transform 0.3s ease,
      box-shadow 0.3s ease;
    cursor: pointer;
  }
  .course-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--card-shadow-hover);
  }

  /* Thumbnail */
  .course-thumb {
    position: relative;
    height: 185px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .course-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }
  .course-card:hover .course-thumb img {
    transform: scale(1.06);
  }

  .course-thumb-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(0, 0, 0, 0.55) 0%,
      transparent 60%
    );
  }

  /* Play button on hover */
  .course-play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    width: 44px;
    height: 44px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    font-size: 1rem;
    opacity: 0;
    transition:
      opacity 0.25s ease,
      transform 0.25s ease;
  }
  .course-card:hover .course-play-btn {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Category badge on thumb */
  .course-cat-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 4px;
    color: #fff;
  }

  /* Bestseller / New badge */
  .course-top-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 3px 9px;
    border-radius: 4px;
  }

  /* Body */
  .course-body {
    padding: 18px 18px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .course-title {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.45;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .course-instructor {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .course-instructor img {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    object-fit: cover;
  }

  /* Rating row */
  .course-rating-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 12px;
    font-size: 0.78rem;
  }
  .course-rating-val {
    font-weight: 700;
    color: #d97706;
  }
  .course-stars {
    color: #fbbf24;
    letter-spacing: 0.5px;
    font-size: 0.72rem;
  }
  .course-rating-count {
    color: var(--text-muted);
  }

  /* Meta pills */
  .course-meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .course-meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.72rem;
    color: var(--text-muted);
    background: var(--surface-alt);
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
  }
  .course-meta-pill i {
    font-size: 0.7rem;
  }

  /* Footer */
  .course-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-top: 1px solid var(--border-color);
    background: var(--surface-alt);
    flex-shrink: 0;
  }
  .course-students {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .course-price {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--primary);
  }
  .course-price-original {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-muted);
    text-decoration: line-through;
    margin-left: 4px;
  }

  /* ── "View All" CTA ─────────────────────────────────────────── */
  .courses-view-all {
    text-align: center;
    margin-top: 52px;
  }
  .btn-view-all {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 34px;
    border-radius: 50px;
    background: transparent;
    border: 2px solid var(--primary);
    color: var(--primary);
    font-size: 0.9rem;
    font-weight: 700;
    text-decoration: none;
    font-family: var(--font-family);
    transition:
      background 0.2s ease,
      color 0.2s ease,
      transform 0.2s ease;
  }
  .btn-view-all:hover {
    background: var(--primary);
    color: #fff;
    transform: translateY(-2px);
    text-decoration: none;
  }

  /* ── Empty state ────────────────────────────────────────────── */
  .courses-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .courses-empty i {
    font-size: 2.5rem;
    opacity: 0.3;
    display: block;
    margin-bottom: 12px;
  }
</style>

<!-- ════════════════════════════════════════════════════════════
     POPULAR COURSES SECTION
     ════════════════════════════════════════════════════════════ -->
<section class="courses-section" id="popular-courses" x-data="popularCourses()">
  <div class="container">
    <!-- ── Section Header ──────────────────────────────────────── -->
    <div class="text-center mb-5" data-aos="fade-up">
      <div class="courses-eyebrow">
        <i class="bi bi-collection-play-fill"></i>
        Trending Courses
      </div>
      <h2 class="courses-title">
        Our Most <span class="accent">Popular Courses</span>
      </h2>
      <p class="courses-subtitle">
        Hand-picked by our experts — the courses students love most. Start today
        and join thousands of successful learners.
      </p>
    </div>

    <!-- ── Filter Tabs ─────────────────────────────────────────── -->
    <div class="courses-filter-tabs" data-aos="fade-up" data-aos-delay="80">
      <template x-for="tab in tabs" :key="tab.key">
        <button
          class="filter-tab"
          :class="{ active: activeTab === tab.key }"
          @click="setTab(tab.key)"
          x-text="tab.label"
        ></button>
      </template>
    </div>

    <!-- ── Courses Grid ─────────────────────────────────────────── -->
    <div class="row g-4" id="coursesGrid">
      <template x-for="(course, index) in filteredCourses" :key="course.id">
        <div
          class="col-sm-6 col-lg-4"
          x-show="true"
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 transform scale-95"
          x-transition:enter-end="opacity-100 transform scale-100"
        >
          <div
            class="course-card h-100"
            @click="window.location='course-detail.html'"
          >
            <!-- Thumbnail -->
            <div class="course-thumb">
              <img :src="course.thumb" :alt="course.title" loading="lazy" />
              <div class="course-thumb-overlay"></div>
              <div class="course-play-btn"><i class="bi bi-play-fill"></i></div>
              <span
                class="course-cat-badge"
                :style="'background:' + course.catColor"
              >
                <span x-text="course.category"></span>
              </span>
              <span
                x-show="course.badge"
                class="course-top-badge"
                :style="'background:' + course.badgeColor + '; color:' + (course.badgeColor === '#fbbf24' ? '#78350f' : '#fff')"
                x-text="course.badge"
              ></span>
            </div>

            <!-- Body -->
            <div class="course-body">
              <h3 class="course-title" x-text="course.title"></h3>

              <div class="course-instructor">
                <img :src="course.instructorAvatar" :alt="course.instructor" />
                <span x-text="course.instructor"></span>
              </div>

              <div class="course-rating-row">
                <span class="course-rating-val" x-text="course.rating"></span>
                <span class="course-stars">★★★★★</span>
                <span
                  class="course-rating-count"
                  x-text="'(' + course.reviews + ' reviews)'"
                ></span>
              </div>

              <div class="course-meta-row">
                <span class="course-meta-pill">
                  <i class="bi bi-collection-play"></i>
                  <span x-text="course.lessons + ' lessons'"></span>
                </span>
                <span class="course-meta-pill">
                  <i class="bi bi-clock"></i>
                  <span x-text="course.duration"></span>
                </span>
                <span class="course-meta-pill">
                  <i class="bi bi-bar-chart-fill"></i>
                  <span x-text="course.level"></span>
                </span>
              </div>
            </div>

            <!-- Footer -->
            <div class="course-footer">
              <div class="course-students">
                <i class="bi bi-people-fill"></i>
                <span x-text="course.students + ' students'"></span>
              </div>
              <div>
                <span class="course-price" x-text="course.price"></span>
                <span
                  class="course-price-original"
                  x-show="course.originalPrice"
                  x-text="course.originalPrice"
                ></span>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- Empty state -->
      <div class="col-12 courses-empty" x-show="filteredCourses.length === 0">
        <i class="bi bi-search"></i>
        No courses found in this category yet.
      </div>
    </div>
    <!-- /Grid -->

    <!-- ── View All CTA ─────────────────────────────────────────── -->
    <div class="courses-view-all" data-aos="fade-up">
      <a href="courses.html" class="btn-view-all">
        View All Courses
        <i class="bi bi-arrow-right"></i>
      </a>
    </div>
  </div>
</section>
<!-- /POPULAR COURSES SECTION -->
