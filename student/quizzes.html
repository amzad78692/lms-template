<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzes — EduLearn Student</title>

    <!-- Bootstrap 5.3 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- NProgress -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/nprogress@0.2.0/nprogress.css"
    />
    <!-- Notyf -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
    />
    <!-- Theme -->
    <link rel="stylesheet" href="../assets/css/theme.css" />

    <style>
      /* ── Layout ───────────────────────────────────────────────── */
      body {
        font-family: "Poppins", sans-serif;
        background: var(--body-bg);
        color: var(--body-color);
      }
      @media (max-width: 991px) {
        #main-content {
          margin-left: 0 !important;
        }
      }

      /* ── Stats strip ──────────────────────────────────────────── */
      .stat-pill {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: box-shadow 0.2s;
      }
      .stat-pill:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      .stat-icon {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        flex-shrink: 0;
      }
      .stat-val {
        font-size: 1.35rem;
        font-weight: 700;
        line-height: 1;
      }
      .stat-lbl {
        font-size: 0.72rem;
        color: var(--text-muted);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      /* ── Tab bar ──────────────────────────────────────────────── */
      .quiz-tabs {
        border-bottom: 2px solid var(--border-color);
      }
      .quiz-tabs .nav-link {
        color: var(--text-muted);
        border: none;
        border-bottom: 2px solid transparent;
        padding: 0.55rem 1rem;
        font-size: 0.88rem;
        font-weight: 500;
        margin-bottom: -2px;
        transition:
          color 0.2s,
          border-color 0.2s;
      }
      .quiz-tabs .nav-link:hover {
        color: var(--primary);
      }
      .quiz-tabs .nav-link.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }
      .tab-badge {
        font-size: 0.7rem;
        padding: 2px 7px;
        border-radius: 20px;
        font-weight: 600;
        margin-left: 4px;
      }

      /* ── Quiz card ────────────────────────────────────────────── */
      .quiz-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 20px;
        transition:
          box-shadow 0.2s,
          transform 0.15s;
        position: relative;
        overflow: hidden;
      }
      .quiz-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--card-accent, var(--primary));
        border-radius: 14px 0 0 14px;
      }
      .quiz-card:hover {
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
      }
      .quiz-course-badge {
        font-size: 0.72rem;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 8px;
      }
      .quiz-meta {
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .quiz-meta span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      /* status accent colours */
      .quiz-card[data-status="pending"] {
        --card-accent: #f59e0b;
      }
      .quiz-card[data-status="completed"] {
        --card-accent: #10b981;
      }
      .quiz-card[data-status="missed"] {
        --card-accent: #ef4444;
      }
      .quiz-card[data-status="inprogress"] {
        --card-accent: #6366f1;
      }

      /* ── Score radial wrapper ─────────────────────────────────── */
      .score-radial {
        width: 80px;
        height: 80px;
        flex-shrink: 0;
      }

      /* ── Timer display ────────────────────────────────────────── */
      .quiz-timer {
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }
      .quiz-timer.urgent {
        color: #ef4444;
        animation: pulse-red 1s infinite;
      }
      @keyframes pulse-red {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }

      /* ── Question card ────────────────────────────────────────── */
      .option-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 12px 16px;
        border-radius: 10px;
        border: 2px solid var(--border-color);
        background: var(--body-bg);
        color: var(--body-color);
        font-size: 0.9rem;
        font-weight: 500;
        transition:
          border-color 0.15s,
          background 0.15s;
        cursor: pointer;
      }
      .option-btn:hover {
        border-color: var(--primary);
        background: rgba(13, 110, 253, 0.06);
      }
      .option-btn.selected {
        border-color: var(--primary);
        background: rgba(13, 110, 253, 0.12);
      }
      .option-btn.correct {
        border-color: #10b981;
        background: rgba(16, 185, 129, 0.12);
      }
      .option-btn.wrong {
        border-color: #ef4444;
        background: rgba(239, 68, 68, 0.12);
      }
      .option-letter {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--border-color);
        color: var(--body-color);
        font-size: 0.78rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .option-btn.selected .option-letter {
        background: var(--primary);
        color: #fff;
      }
      .option-btn.correct .option-letter {
        background: #10b981;
        color: #fff;
      }
      .option-btn.wrong .option-letter {
        background: #ef4444;
        color: #fff;
      }

      /* progress dots */
      .q-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--border-color);
        transition: background 0.2s;
      }
      .q-dot.answered {
        background: var(--primary);
      }
      .q-dot.current {
        background: var(--primary);
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
      }
      .q-dot.correct {
        background: #10b981;
      }
      .q-dot.wrong {
        background: #ef4444;
      }

      /* ── Results overlay ──────────────────────────────────────── */
      .results-overlay {
        position: fixed;
        inset: 0;
        z-index: 1060;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fadeIn 0.3s ease;
      }
      .results-card {
        background: var(--card-bg);
        border-radius: 20px;
        padding: 40px 36px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        animation: slideUp 0.35s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Review modal answers ─────────────────────────────────── */
      .review-option {
        padding: 10px 14px;
        border-radius: 9px;
        border: 2px solid var(--border-color);
        margin-bottom: 8px;
        font-size: 0.88rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .review-option.correct {
        border-color: #10b981;
        background: rgba(16, 185, 129, 0.08);
      }
      .review-option.wrong {
        border-color: #ef4444;
        background: rgba(239, 68, 68, 0.08);
      }
      .review-option.neutral {
        border-color: var(--border-color);
      }

      /* ── Empty state ──────────────────────────────────────────── */
      .empty-state {
        padding: 60px 20px;
        text-align: center;
      }
      .empty-icon {
        font-size: 3.5rem;
        color: var(--text-muted);
        margin-bottom: 12px;
      }

      /* ── Dark mode tweaks ─────────────────────────────────────── */
      [data-theme="dark"] .quiz-card {
        box-shadow: none;
      }
      [data-theme="dark"] .quiz-card:hover {
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      [data-theme="dark"] .option-btn {
        background: #1e1e2e;
      }
      [data-theme="dark"] .option-btn:hover {
        background: rgba(13, 110, 253, 0.1);
      }
      [data-theme="dark"] .results-card {
        border: 1px solid var(--border-color);
      }
    </style>
  </head>

  <body x-data="themeToggle()" :data-theme="dark ? 'dark' : 'light'">
    <!-- ── Layout Wrapper ──────────────────────────────────────── -->
    <div
      id="layout-wrapper"
      x-data="sidebarState()"
      style="display: flex; min-height: 100vh"
    >
      <!-- Sidebar placeholder -->
      <div id="sidebar-placeholder"></div>

      <!-- Navbar + Main -->
      <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
        <div id="navbar-placeholder"></div>

        <!-- Main content -->
        <div
          id="main-content"
          :style="'margin-left:' + (collapsed ? 'var(--sidebar-collapsed)' : 'var(--sidebar-width)')"
          style="
            transition: margin-left 0.25s ease;
            padding-top: var(--navbar-height);
          "
        >
          <div class="container-fluid px-4 py-4" x-data="quizzesPage()">
            <!-- ── Page Header ──────────────────────────────────── -->
            <div
              class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2"
            >
              <div>
                <h4 class="fw-700 mb-1">Quizzes</h4>
                <p class="text-muted mb-0" style="font-size: 0.85rem">
                  Test your knowledge and track your scores
                </p>
              </div>
              <div class="d-flex gap-2">
                <select
                  class="form-select form-select-sm"
                  style="width: 160px"
                  x-model="filterCourse"
                >
                  <option value="">All Courses</option>
                  <template x-for="c in courses" :key="c"
                    ><option :value="c" x-text="c"></option
                  ></template>
                </select>
                <select
                  class="form-select form-select-sm"
                  style="width: 140px"
                  x-model="sortBy"
                >
                  <option value="dueDate">Sort: Due Date</option>
                  <option value="score">Sort: Score</option>
                  <option value="title">Sort: Title</option>
                </select>
              </div>
            </div>

            <!-- ── Stats Strip ─────────────────────────────────── -->
            <div class="row g-3 mb-4">
              <div
                class="col-6 col-md-4 col-xl-2half"
                style="flex: 0 0 20%; max-width: 20%"
              >
                <div class="stat-pill">
                  <div
                    class="stat-icon"
                    style="background: rgba(13, 110, 253, 0.12); color: #0d6efd"
                  >
                    <i class="bi bi-patch-question-fill"></i>
                  </div>
                  <div>
                    <div class="stat-val" x-text="quizzes.length">12</div>
                    <div class="stat-lbl">Total</div>
                  </div>
                </div>
              </div>
              <div
                class="col-6 col-md-4 col-xl-2half"
                style="flex: 0 0 20%; max-width: 20%"
              >
                <div class="stat-pill">
                  <div
                    class="stat-icon"
                    style="background: rgba(16, 185, 129, 0.12); color: #10b981"
                  >
                    <i class="bi bi-check-circle-fill"></i>
                  </div>
                  <div>
                    <div class="stat-val" x-text="countByStatus('completed')">
                      7
                    </div>
                    <div class="stat-lbl">Completed</div>
                  </div>
                </div>
              </div>
              <div
                class="col-6 col-md-4 col-xl-2half"
                style="flex: 0 0 20%; max-width: 20%"
              >
                <div class="stat-pill">
                  <div
                    class="stat-icon"
                    style="background: rgba(245, 158, 11, 0.12); color: #f59e0b"
                  >
                    <i class="bi bi-clock-fill"></i>
                  </div>
                  <div>
                    <div class="stat-val" x-text="countByStatus('pending')">
                      3
                    </div>
                    <div class="stat-lbl">Pending</div>
                  </div>
                </div>
              </div>
              <div
                class="col-6 col-md-4 col-xl-2half"
                style="flex: 0 0 20%; max-width: 20%"
              >
                <div class="stat-pill">
                  <div
                    class="stat-icon"
                    style="background: rgba(239, 68, 68, 0.12); color: #ef4444"
                  >
                    <i class="bi bi-x-circle-fill"></i>
                  </div>
                  <div>
                    <div class="stat-val" x-text="countByStatus('missed')">
                      2
                    </div>
                    <div class="stat-lbl">Missed</div>
                  </div>
                </div>
              </div>
              <div
                class="col-6 col-md-4 col-xl-2half"
                style="flex: 0 0 20%; max-width: 20%"
              >
                <div class="stat-pill">
                  <div
                    class="stat-icon"
                    style="background: rgba(99, 102, 241, 0.12); color: #6366f1"
                  >
                    <i class="bi bi-bar-chart-fill"></i>
                  </div>
                  <div>
                    <div class="stat-val" x-text="avgScore + '%'">78%</div>
                    <div class="stat-lbl">Avg Score</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- ── Tabs ────────────────────────────────────────── -->
            <ul class="nav quiz-tabs mb-4">
              <li class="nav-item">
                <button
                  class="nav-link"
                  :class="{active: activeTab==='all'}"
                  @click="activeTab='all'"
                >
                  All
                  <span
                    class="tab-badge bg-secondary text-white"
                    x-text="quizzes.length"
                  ></span>
                </button>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  :class="{active: activeTab==='pending'}"
                  @click="activeTab='pending'"
                >
                  Pending
                  <span
                    class="tab-badge bg-warning text-dark"
                    x-text="countByStatus('pending')"
                  ></span>
                </button>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  :class="{active: activeTab==='completed'}"
                  @click="activeTab='completed'"
                >
                  Completed
                  <span
                    class="tab-badge bg-success text-white"
                    x-text="countByStatus('completed')"
                  ></span>
                </button>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  :class="{active: activeTab==='missed'}"
                  @click="activeTab='missed'"
                >
                  Missed
                  <span
                    class="tab-badge bg-danger text-white"
                    x-text="countByStatus('missed')"
                  ></span>
                </button>
              </li>
            </ul>

            <!-- ── Quiz List ────────────────────────────────────── -->
            <div class="row g-3">
              <template x-for="(q, idx) in filteredQuizzes" :key="q.id">
                <div class="col-12 col-xl-6">
                  <div class="quiz-card" :data-status="q.status">
                    <!-- Course badge + status -->
                    <div
                      class="d-flex align-items-start justify-content-between mb-2"
                    >
                      <span
                        class="quiz-course-badge"
                        :style="'background:' + q.courseColor + '22; color:' + q.courseColor"
                        x-text="q.course"
                      ></span>
                      <span
                        class="badge rounded-pill"
                        :class="{
                            'bg-warning text-dark': q.status==='pending',
                            'bg-success':           q.status==='completed',
                            'bg-danger':            q.status==='missed',
                            'bg-primary':           q.status==='inprogress'
                          }"
                        x-text="q.status === 'inprogress' ? 'In Progress' : q.status.charAt(0).toUpperCase()+q.status.slice(1)"
                      >
                      </span>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                      <!-- Info -->
                      <div class="flex-grow-1">
                        <h6 class="fw-600 mb-1" x-text="q.title"></h6>
                        <div class="quiz-meta d-flex flex-wrap gap-3 mb-3">
                          <span
                            ><i class="bi bi-question-circle"></i>
                            <span x-text="q.questions"></span> Qs</span
                          >
                          <span
                            ><i class="bi bi-clock"></i>
                            <span x-text="q.duration + ' min'"></span
                          ></span>
                          <span x-show="q.attempts > 0"
                            ><i class="bi bi-arrow-repeat"></i>
                            <span x-text="q.attempts"></span> attempts</span
                          >
                          <span
                            :class="{'text-danger fw-500': isOverdue(q)}"
                            x-show="q.status !== 'completed'"
                          >
                            <i class="bi bi-calendar-event"></i>
                            <span x-text="formatDue(q.dueDate)"></span>
                          </span>
                          <span
                            x-show="q.status === 'completed'"
                            class="text-success"
                          >
                            <i class="bi bi-calendar-check"></i>
                            <span
                              x-text="'Submitted ' + dayjs(q.submittedAt).fromNow()"
                            ></span>
                          </span>
                        </div>

                        <!-- Action buttons -->
                        <div class="d-flex gap-2 flex-wrap">
                          <!-- Pending / In Progress -->
                          <template
                            x-if="q.status === 'pending' || q.status === 'inprogress'"
                          >
                            <button
                              class="btn btn-primary btn-sm"
                              @click="startQuiz(q)"
                            >
                              <i class="bi bi-play-fill me-1"></i>
                              <span
                                x-text="q.status === 'inprogress' ? 'Continue Quiz' : 'Start Quiz'"
                              ></span>
                            </button>
                          </template>
                          <!-- Completed -->
                          <template x-if="q.status === 'completed'">
                            <button
                              class="btn btn-outline-primary btn-sm"
                              @click="reviewQuiz(q)"
                            >
                              <i class="bi bi-eye me-1"></i>Review Answers
                            </button>
                          </template>
                          <!-- Missed -->
                          <template x-if="q.status === 'missed'">
                            <button
                              class="btn btn-outline-secondary btn-sm"
                              disabled
                            >
                              <i class="bi bi-lock me-1"></i>Quiz Closed
                            </button>
                          </template>
                          <!-- Details -->
                          <button
                            class="btn btn-outline-secondary btn-sm"
                            @click="showDetails(q)"
                          >
                            <i class="bi bi-info-circle"></i>
                          </button>
                        </div>
                      </div>

                      <!-- Score radial (completed only) -->
                      <template x-if="q.status === 'completed'">
                        <div class="score-radial" :id="'radial-' + q.id"></div>
                      </template>

                      <!-- Countdown (pending only) -->
                      <template
                        x-if="q.status === 'pending' && getDaysUntil(q.dueDate) <= 3"
                      >
                        <div class="text-center" style="min-width: 70px">
                          <div
                            class="fw-700"
                            style="font-size: 1.5rem; color: #f59e0b"
                            x-text="getDaysUntil(q.dueDate)"
                          ></div>
                          <div
                            style="font-size: 0.72rem; color: var(--text-muted)"
                          >
                            days left
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Empty state -->
              <template x-if="filteredQuizzes.length === 0">
                <div class="col-12">
                  <div class="empty-state">
                    <div class="empty-icon">
                      <i class="bi bi-patch-question"></i>
                    </div>
                    <h6 class="fw-600 mb-2">No quizzes found</h6>
                    <p class="text-muted mb-0">
                      There are no quizzes matching the selected filter.
                    </p>
                  </div>
                </div>
              </template>
            </div>
          </div>
          <!-- /container -->
        </div>
        <!-- /main-content -->
      </div>
    </div>
    <!-- /layout-wrapper -->

    <!-- ══════════════════════════════════════════════════════════
       QUIZ ATTEMPT MODAL
  ══════════════════════════════════════════════════════════════ -->
    <div
      class="modal fade"
      id="quizAttemptModal"
      tabindex="-1"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div
          class="modal-content"
          style="
            background: var(--card-bg);
            border: 1px solid var(--border-color);
          "
        >
          <!-- Header -->
          <div class="modal-header border-0 pb-0">
            <div class="flex-grow-1">
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <h5 class="modal-title fw-700 mb-0" id="quizAttemptTitle">
                    Quiz Title
                  </h5>
                  <small class="text-muted" id="quizAttemptCourse"
                    >Course Name</small
                  >
                </div>
                <!-- Timer -->
                <div class="text-center">
                  <div class="quiz-timer" id="quizTimerDisplay">30:00</div>
                  <div style="font-size: 0.72rem; color: var(--text-muted)">
                    remaining
                  </div>
                </div>
              </div>
              <!-- Question progress dots -->
              <div class="d-flex gap-2 mt-3 flex-wrap" id="questionDots"></div>
              <!-- Progress bar -->
              <div
                class="progress mt-2"
                style="height: 5px; border-radius: 10px"
              >
                <div
                  class="progress-bar"
                  id="quizProgressBar"
                  role="progressbar"
                  style="width: 0%; transition: width 0.3s"
                ></div>
              </div>
              <div class="d-flex justify-content-between mt-1">
                <small class="text-muted"
                  >Question <span id="currentQNum">1</span> of
                  <span id="totalQNum">5</span></small
                >
                <small class="text-muted"

          get filteredQuizzes() {
            let list = this.quizzes;
            if (this.activeTab !== "all")
              list = list.filter((q) => q.status === this.activeTab);
            if (this.filterCourse)
              list = list.filter((q) => q.course === this.filterCourse);
            if (this.sortBy === "dueDate")
              list = [...list].sort(
                (a, b) => new Date(a.dueDate) - new Date(b.dueDate),
              );
            if (this.sortBy === "score")
              list = [...list].sort((a, b) => (b.score || 0) - (a.score || 0));
            if (this.sortBy === "title")
              list = [...list].sort((a, b) => a.title.localeCompare(b.title));
            return list;
          },

          get avgScore() {
            const done = this.quizzes.filter((q) => q.score !== null);
            if (!done.length) return 0;
            return Math.round(
              done.reduce((s, q) => s + q.score, 0) / done.length,
            );
          },

          countByStatus(s) {
            return this.quizzes.filter((q) => q.status === s).length;
          },

          isOverdue(q) {
            return (
              q.status !== "completed" && dayjs(q.dueDate).isBefore(dayjs())
            );
          },
          getDaysUntil(d) {
            return Math.max(0, dayjs(d).diff(dayjs(), "day"));
          },
          formatDue(d) {
            const diff = dayjs(d).diff(dayjs(), "day");
            if (diff < 0) return "Overdue";
            if (diff === 0) return "Due Today";
            if (diff === 1) return "Due Tomorrow";
            return "Due " + dayjs(d).fromNow();

          reviewQuiz(q) {

              // Render small radial charts for completed quizzes

      /* ── Mini radial (score in card) ─────────────────────────────── */
      function renderMiniRadial(id, score, passed) {
        const el = document.getElementById("radial-" + id);
        if (!el) return;
        const color =
          score >= 80 ? "#10b981" : score >= 60 ? "#f59e0b" : "#ef4444";
        new ApexCharts(el, {
          chart: {
            type: "radialBar",
            height: 80,
            sparkline: { enabled: true },
          },
          series: [score],
          colors: [color],
          plotOptions: {
            radialBar: {
              startAngle: -90,
              endAngle: 90,
              hollow: { size: "55%" },
              dataLabels: {
                name: { show: false },
                value: {
                  fontSize: "13px",
                  fontWeight: 700,
                  fontFamily: "Poppins",
                  offsetY: -10,
                  formatter: (v) => v + "%",
                  color: "var(--body-color)",
                },
              },
              track: { background: "rgba(128,128,128,.15)" },
            },
          },
          stroke: { lineCap: "round" },
          grid: { padding: { top: -15 } },
        }).render();
      }

      /* ── Start quiz attempt ──────────────────────────────────────── */
      function startQuizAttempt(q) {
        window
          .lmsConfirm({
            title: "Start Quiz?",
            text: `"${q.title}" — ${q.questions} questions, ${q.duration} minutes. Make sure you are ready.`,
            icon: "question",
            confirmButtonText: "Start Now",
            confirmButtonColor: "#0d6efd",
          })
          .then((r) => {
            if (!r.isConfirmed) return;
            currentQuiz = q;
            currentQuestions = [
              ...(QUESTION_BANK[q.questionBank] || QUESTION_BANK.default),
            ].slice(0, q.questions);
            currentQIdx = 0;
            answers = new Array(currentQuestions.length).fill(null);
            secondsLeft = q.duration * 60;
            secondsUsed = 0;

            // Populate modal header
            document.getElementById("quizAttemptTitle").textContent = q.title;
            document.getElementById("quizAttemptCourse").textContent = q.course;
            document.getElementById("totalQNum").textContent =
              currentQuestions.length;

            renderQuestionDots();
            renderQuestion();
            startTimer();

            quizModalEl = document.getElementById("quizAttemptModal");
            quizModal = new bootstrap.Modal(quizModalEl);
            quizModal.show();
          });
      }

      /* ── Timer ───────────────────────────────────────────────────── */
      function startTimer() {
        clearInterval(timerInterval);
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          secondsLeft--;
          secondsUsed++;
          updateTimerDisplay();
          if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            submitQuiz(true);
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        const m = Math.floor(secondsLeft / 60);
        const s = secondsLeft % 60;
        const el = document.getElementById("quizTimerDisplay");
        if (!el) return;
        el.textContent =
          String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        el.className = "quiz-timer" + (secondsLeft <= 60 ? " urgent" : "");
      }

      /* ── Render question ─────────────────────────────────────────── */
      function renderQuestion() {
        const q = currentQuestions[currentQIdx];
        const answered = answers.filter((a) => a !== null).length;
        document.getElementById("currentQNum").textContent = currentQIdx + 1;
        document.getElementById("answeredCount").textContent = answered;
        document.getElementById("quizProgressBar").style.width =
          (currentQIdx / currentQuestions.length) * 100 + "%";

        // Prev / Next / Submit buttons
        document.getElementById("quizPrevBtn").disabled = currentQIdx === 0;
        const isLast = currentQIdx === currentQuestions.length - 1;
        document
          .getElementById("quizNextBtn")
          .classList.toggle("d-none", isLast);
        document
          .getElementById("quizSubmitBtn")
          .classList.toggle("d-none", !isLast);

        // Question HTML
        const selected = answers[currentQIdx];
        const letters = ["A", "B", "C", "D"];
        document.getElementById("questionContainer").innerHTML = `
      <div class="mb-3">
        <div class="d-flex align-items-center gap-2 mb-3">
          <span class="badge bg-primary rounded-pill">${currentQIdx + 1}</span>
          <p class="mb-0 fw-600" style="font-size:.95rem;">${q.q}</p>
        </div>
        <div class="d-flex flex-column gap-2">
          ${q.options
            .map(
              (opt, i) => `
            <button class="option-btn ${selected === i ? "selected" : ""}" onclick="selectAnswer(${i})">
              <span class="option-letter">${letters[i]}</span>
              ${opt}
            </button>
          `,
            )
            .join("")}
        </div>
      </div>
    `;
        updateDots();
      }

      function selectAnswer(idx) {
        answers[currentQIdx] = idx;
        renderQuestion();
      }

      function quizNav(dir) {
        currentQIdx = Math.max(
          0,
          Math.min(currentQuestions.length - 1, currentQIdx + dir),
        );
        renderQuestion();
      }

      /* ── Question dots ───────────────────────────────────────────── */
      function renderQuestionDots() {
        const container = document.getElementById("questionDots");
        container.innerHTML = currentQuestions
          .map(
            (_, i) =>
              `<div class="q-dot" id="qdot-${i}" onclick="jumpToQuestion(${i})" style="cursor:pointer;" title="Q${i + 1}"></div>`,
          )
          .join("");
      }

      function updateDots() {
        currentQuestions.forEach((_, i) => {
          const dot = document.getElementById("qdot-" + i);
          if (!dot) return;
          dot.className = "q-dot";
          if (i === currentQIdx) dot.classList.add("current");
          else if (answers[i] !== null) dot.classList.add("answered");
        });
      }

      function jumpToQuestion(idx) {
        currentQIdx = idx;
        renderQuestion();
      }

      /* ── Submit quiz ─────────────────────────────────────────────── */
      function submitQuiz(autoSubmit = false) {
        clearInterval(timerInterval);
        const unanswered = answers.filter((a) => a === null).length;

        const doSubmit = () => {
          if (quizModal) quizModal.hide();
          // Grade
          let correct = 0;
          answers.forEach((ans, i) => {
            if (ans === currentQuestions[i].correct) correct++;
          });
          const score = Math.round((correct / currentQuestions.length) * 100);
          const timeUsed = currentQuiz.duration * 60 - secondsLeft;
          secondsUsed = timeUsed;

          // Update quiz status in Alpine data
          const alpineEl = document.querySelector("[x-data]");
          if (alpineEl && alpineEl._x_dataStack) {
            const comp = alpineEl._x_dataStack.find((d) => d.quizzes);
            if (comp) {
              const qz = comp.quizzes.find((q) => q.id === currentQuiz.id);
              if (qz) {
                qz.status = "completed";
                qz.score = score;
                qz.passed = score >= 60;
                qz.submittedAt = new Date().toISOString();
                qz.attempts = (qz.attempts || 0) + 1;
              }
            }
          }
          lastCompletedQuizId = currentQuiz.id;
          showResults(
            score,
            correct,
            currentQuestions.length - correct,
            timeUsed,
          );
        };

        if (autoSubmit) {
          doSubmit();
          return;
        }

        if (unanswered > 0) {
          window
            .lmsConfirm({
              title: `${unanswered} unanswered question${unanswered > 1 ? "s" : ""}`,
              text: "You have unanswered questions. Submit anyway?",
              icon: "warning",
              confirmButtonText: "Submit Anyway",
              confirmButtonColor: "#0d6efd",
            })
            .then((r) => {
              if (r.isConfirmed) doSubmit();
            });
        } else {
          doSubmit();
        }
      }

      /* ── Abandon quiz ────────────────────────────────────────────── */
      function abandonQuiz() {
        window
          .lmsConfirm({
            title: "Abandon Quiz?",
            text: "Your progress will be lost. This attempt will be counted.",
            icon: "warning",
            confirmButtonText: "Yes, Abandon",
            confirmButtonColor: "#ef4444",
          })
          .then((r) => {
            if (r.isConfirmed) {
              clearInterval(timerInterval);
              if (quizModal) quizModal.hide();
              window.lmsNotify.error("Quiz abandoned. No score recorded.");
            }
          });
      }

      /* ── Show results ────────────────────────────────────────────── */
      function showResults(score, correct, wrong, timeUsed) {
        const overlay = document.getElementById("resultsOverlay");
        overlay.classList.remove("d-none");

        const grade =
          score >= 90
            ? "A — Excellent!"
            : score >= 80
              ? "B — Great work!"
              : score >= 70
                ? "C — Good effort"
                : score >= 60
                  ? "D — Passed (barely)"
                  : "F — Failed";
        const color =
          score >= 80 ? "#10b981" : score >= 60 ? "#f59e0b" : "#ef4444";
        const m = Math.floor(timeUsed / 60),
          s = timeUsed % 60;

        document.getElementById("resultScoreLabel").textContent =
          score + "% Score";
        document.getElementById("resultScoreLabel").style.color = color;
        document.getElementById("resultGradeLabel").textContent = grade;
        document.getElementById("resultCorrect").textContent = correct;
        document.getElementById("resultWrong").textContent = wrong;
        document.getElementById("resultTime").textContent = m + "m " + s + "s";

        const chartEl = document.getElementById("resultRadialChart");
        chartEl.innerHTML = "";
        new ApexCharts(chartEl, {
          chart: {
            type: "radialBar",
            height: 180,
            sparkline: { enabled: true },
          },
          series: [score],
          colors: [color],
          plotOptions: {
            radialBar: {
              startAngle: -135,
              endAngle: 135,
              hollow: { size: "60%" },
              dataLabels: {
                name: { show: false },
                value: {
                  fontSize: "28px",
                  fontWeight: 700,
                  fontFamily: "Poppins",
                  offsetY: 10,
                  formatter: (v) => v + "%",
                  color: "var(--body-color)",
                },
              },
              track: { background: "rgba(128,128,128,.15)" },
            },
          },
          stroke: { lineCap: "round" },
        }).render();

        // Re-render mini radial for this quiz
        setTimeout(() => {
          if (lastCompletedQuizId) {
            const el = document.getElementById("radial-" + lastCompletedQuizId);
            if (el) {
              el.innerHTML = "";
              renderMiniRadial(lastCompletedQuizId, score, score >= 60);
            }
          }
        }, 400);
      }

      function closeResults() {
        document.getElementById("resultsOverlay").classList.add("d-none");
        window.lmsNotify.success("Quiz submitted successfully!");
      }

      function openReviewFromResult() {
        document.getElementById("resultsOverlay").classList.add("d-none");
        if (currentQuiz) openReviewModal(currentQuiz);
      }

      /* ── Review modal ────────────────────────────────────────────── */
      function openReviewModal(q) {
        document.getElementById("reviewModalTitle").textContent =
          "Review: " + q.title;
        const questions =
          QUESTION_BANK[q.questionBank] || QUESTION_BANK.default;
        const letters = ["A", "B", "C", "D"];
        const isCurrentAttempt =
          q.id === (currentQuiz && currentQuiz.id) &&
          answers.some((a) => a !== null);

        let html = "";
        questions.forEach((qItem, qi) => {
          const userAns = isCurrentAttempt
            ? answers[qi]
            : q.score >= 80
              ? qItem.correct
              : qi % 2 === 0
                ? qItem.correct
                : (qItem.correct + 1) % 4;
          html += `
        <div class="mb-4">
          <div class="d-flex gap-2 align-items-start mb-2">
            <span class="badge bg-secondary rounded-pill flex-shrink-0">${qi + 1}</span>
            <p class="mb-0 fw-600">${qItem.q}</p>
          </div>
          ${qItem.options
            .map((opt, oi) => {
              let cls = "neutral";
              if (oi === qItem.correct) cls = "correct";
              else if (oi === userAns && userAns !== qItem.correct)
                cls = "wrong";
              const icon =
                oi === qItem.correct
                  ? '<i class="bi bi-check-circle-fill text-success me-2"></i>'
                  : oi === userAns
                    ? '<i class="bi bi-x-circle-fill text-danger me-2"></i>'
                    : "";
              return `<div class="review-option ${cls}">${icon}<span class="fw-600 me-2">${letters[oi]}.</span>${opt}${oi === userAns ? ' <span class="badge bg-primary ms-2 fs-xs">Your Answer</span>' : ""}</div>`;
            })
            .join("")}
        </div>
      `;
        });

        document.getElementById("reviewModalBody").innerHTML = html;
        new bootstrap.Modal(document.getElementById("reviewModal")).show();
      }

      /* ── Details modal ───────────────────────────────────────────── */
      function openDetailsModal(q) {
        document.getElementById("detailsModalTitle").textContent = q.title;
        const scoreColor =
          q.score >= 80 ? "#10b981" : q.score >= 60 ? "#f59e0b" : "#ef4444";
        document.getElementById("detailsModalBody").innerHTML = `
      <dl class="row mb-0" style="font-size:.9rem;">
        <dt class="col-5 text-muted">Course</dt>
        <dd class="col-7 fw-600">${q.course}</dd>
        <dt class="col-5 text-muted">Status</dt>
        <dd class="col-7">${q.status.charAt(0).toUpperCase() + q.status.slice(1)}</dd>
        <dt class="col-5 text-muted">Questions</dt>
        <dd class="col-7">${q.questions}</dd>
        <dt class="col-5 text-muted">Duration</dt>
        <dd class="col-7">${q.duration} minutes</dd>
        <dt class="col-5 text-muted">Due Date</dt>
        <dd class="col-7">${dayjs(q.dueDate).format("MMM D, YYYY")}</dd>
        ${q.attempts > 0 ? `<dt class="col-5 text-muted">Attempts</dt><dd class="col-7">${q.attempts}</dd>` : ""}
        ${
          q.score !== null
            ? `
          <dt class="col-5 text-muted">Your Score</dt>
          <dd class="col-7 fw-700" style="color:${scoreColor};">${q.score}%</dd>
          <dt class="col-5 text-muted">Result</dt>
          <dd class="col-7"><span class="badge ${q.passed ? "bg-success" : "bg-danger"}">${q.passed ? "Passed" : "Failed"}</span></dd>
          <dt class="col-5 text-muted">Submitted</dt>
          <dd class="col-7">${dayjs(q.submittedAt).format("MMM D, YYYY [at] h:mm A")}</dd>
        `
            : ""
        }
      </dl>
    `;
        new bootstrap.Modal(document.getElementById("detailsModal")).show();
      }

      /* ── Dark mode ApexCharts theme ──────────────────────────────── */
      new MutationObserver(() => {
        const dark =
          document.documentElement.getAttribute("data-theme") === "dark";
        ApexCharts.exec(
          "*",
          "updateOptions",
          { theme: { mode: dark ? "dark" : "light" } },
          false,
          false,
        );
      }).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"],
      });

      /* ── Load sidebar + navbar ───────────────────────────────────── */
      document.addEventListener("DOMContentLoaded", () => {
        // Sidebar
        fetch("../components/student-sidebar.html")
          .then((r) => r.text())
          .then((html) => {
            const el = document.getElementById("sidebar-placeholder");
            el.innerHTML = html;
            Alpine.initTree(el);
            // Mark active
            const items = el.querySelectorAll(".sidebar-nav-item");
            items.forEach((it) => {
              it.classList.remove("active");
              if (it.querySelector("a")?.href.includes("quizzes"))
                it.classList.add("active");
            });
          });

        // Navbar
        fetch("../components/student-navbar.html")
          .then((r) => r.text())
          .then((html) => {
            const el = document.getElementById("navbar-placeholder");
            el.innerHTML = html;
            Alpine.initTree(el);
            const titleEl = document.getElementById("navbarPageTitle");
            const breadEl = document.getElementById("navbarBreadcrumbCurrent");
            if (titleEl) titleEl.textContent = "Quizzes";
            if (breadEl) breadEl.textContent = "Quizzes";
          });
      });
    </script>
  </body>
</html>
